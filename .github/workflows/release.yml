name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm verify
      - name: Build the app
        run: pnpm build
        env:
          VERSION: ${{ github.ref_name }}
      # A release created on GitHub, rather than by pushing a tag, already exists: it gets the image.
      - name: Publish the release
        run: |
          image=apps/desktop/build/Voice.dmg
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$image" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$image" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
