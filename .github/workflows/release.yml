name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm verify
      - name: Build the app
        run: pnpm build
        env:
          VERSION: ${{ github.ref_name }}
      - name: Publish the release
        run: |
          ditto -c -k --keepParent apps/desktop/build/Voice.app Voice.zip
          gh release create "$GITHUB_REF_NAME" Voice.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
