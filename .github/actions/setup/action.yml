name: Setup
description: Installs the toolchain and the dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Select the newest Xcode
      shell: bash
      run: |
        ls -d /Applications/Xcode_*.app
        xcode="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
        sudo xcode-select --switch "$xcode/Contents/Developer"
        swift --version
